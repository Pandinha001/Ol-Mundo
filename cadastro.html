            <!-- CADASTRO -->

                        <h1>

                <!-- FORMULÁRIO -->
                <div class="formulario">
                    <h2>
                        Criar conta
                    </h2>

                    <p class="subtitulo">
                        Preencha seus dados para começar.
                    </p>

                    <!-- NOME -->
                    <div class="campo">

                        <label>
                            Nome completo
                        </label>
                        <input
                            type="text"
                            placeholder="Seu nome"
                        >
                    </div>
                    <!-- EMAIL -->

                    <div class="campo">
                        <label>
                            E-mail
                        </label>
                        <input
                            type="email"
                            placeholder="email@gmail.com"
                        >
                    </div>
                    <!-- SENHA -->
                    <div class="campo">

                        <label>
                            Senha
                        </label>
                        <input
                            type="password"
                            placeholder="Senha"
                        >
                    </div>
                    <!-- CONFIRMAR SENHA -->
                    <div class="confirmar_senha">
                        <label>
                            Confirmar senha
                        </label>
                        <input
                            type="password"
                            placeholder="Confirme sua senha"
                        >
                    </div>
                    <!-- BOTÃO -->
                    <a
                        href="inicio.html"
                        class="botao_login"
                    >
                        Criar conta
                    </a>

                    <div class="trocar_conta">
